---
name: setup-dev smoke test

'on':
  pull_request:

jobs:
  smoke:
    name: setup-dev (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run setup-dev
        run: ./bin/setup-dev.sh
