---
name: setup-dev smoke test

'on':
  pull_request:

jobs:
  smoke:
    name: setup-dev (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run setup-dev
        run: ./bin/setup-dev.sh
